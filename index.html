<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingo Pro</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #263238;

    background:
        linear-gradient(rgba(20,40,55,.55), rgba(20,40,55,.55)),
        linear-gradient(135deg, #243b55, #141e30);

    min-height: 100vh;
}

header {
    height: 65px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 2px 10px #0003;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #35a853;
    font-size: 24px;
    font-weight: bold;
}

.stats {
    display: flex;
    gap: 7px;
}

.stat {
    background: #f1f3f4;
    padding: 9px 11px;
    border-radius: 12px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px 15px;
}

.hero {
    background: #35a853;
    color: white;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 6px 20px #0004;
}

.hero h1 {
    margin: 0 0 8px;
}

.panel {
    background: rgba(255,255,255,.96);
    border-radius: 22px;
    padding: 22px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin: 15px 0 20px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #35a853;
    transition: .3s;
}

.unit {
    border: 1px solid #ddd;
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 16px;
    background: white;
}

.unit h3 {
    margin-top: 0;
}

.lessons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
}

.lesson {
    min-height: 75px;
    border: 0;
    border-radius: 14px;
    background: #35a853;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.lesson:hover {
    transform: translateY(-2px);
}

.lesson.done {
    background: #218838;
}

.lesson.locked {
    background: #d5dadd;
    color: #68737b;
    cursor: not-allowed;
}

#lessonScreen {
    display: none;
}

.lesson-card {
    max-width: 650px;
    margin: 20px auto;
    background: white;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 6px 25px #0004;
}

.back {
    background: white;
    border: 1px solid #ccc;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
}

.question {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    margin: 35px 0 25px;
}

.answers {
    display: grid;
    gap: 10px;
}

.answer {
    padding: 15px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 13px;
    text-align: left;
    cursor: pointer;
    font-weight: bold;
}

.answer:hover {
    border-color: #35a853;
    background: #f1fff4;
}

.input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 17px;
}

.button {
    border: 0;
    border-radius: 12px;
    padding: 13px 20px;
    font-weight: bold;
    cursor: pointer;
}

.green {
    background: #35a853;
    color: white;
}

.feedback {
    min-height: 28px;
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal-box {
    background: white;
    width: min(400px,100%);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
}

.modal-box input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 2px solid #ddd;
    border-radius: 12px;
}

.hidden {
    display: none;
}

.owl {
    font-size: 42px;
}

@media(max-width:700px) {
    .lessons {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span class="owl">🦉</span>
        Lingo Pro
    </div>

    <div class="stats">
        <div class="stat">🔥 <span id="streak">0</span></div>
        <div class="stat">💎 <span id="gems">50</span></div>
        <div class="stat">⭐ <span id="xp">0</span></div>
    </div>

</header>


<div class="container">

    <!-- ГЛАВНЫЙ ЭКРАН -->

    <section id="home">

        <div class="hero">

            <h1 id="hello">
                Добро пожаловать!
            </h1>

            <p>
                Учись английскому каждый день 🚀
            </p>

        </div>


        <div class="panel">

            <h2>🇬🇧 Путь английского</h2>

            <p>
                60 этапов обучения
            </p>

            <div class="progress">
                <div
                    id="mainProgress"
                    class="progress-bar">
                </div>
            </div>

            <div id="units"></div>

        </div>

    </section>


    <!-- УРОК -->

    <section id="lessonScreen">

        <button
            class="back"
            onclick="goHome()">

            ← Назад

        </button>


        <div class="lesson-card">

            <div style="
                display:flex;
                justify-content:space-between;
            ">

                <b id="lessonTitle">
                    Урок
                </b>

                <b>
                    ❤️ <span id="hearts">5</span>
                </b>

            </div>


            <div class="progress">

                <div
                    id="lessonProgress"
                    class="progress-bar">
                </div>

            </div>


            <div id="question"></div>

            <div
                id="feedback"
                class="feedback">
            </div>

            <div id="answers"></div>

        </div>

    </section>

</div>


<!-- ПРОФИЛЬ -->

<div
    id="profileModal"
    class="modal">

    <div class="modal-box">

        <div class="owl">
            🦉
        </div>

        <h2>
            Добро пожаловать в Lingo Pro
        </h2>

        <p>
            Напиши своё имя.
        </p>

        <input
            id="nameInput"
            placeholder="Например: Farukh"
            maxlength="20">

        <br>

        <button
            class="button green"
            onclick="createUser()">

            Начать обучение

        </button>

    </div>

</div>


<script>

/* =====================================================
   60 ЭТАПОВ
===================================================== */

const lessons = [];


/*
   Создаём 60 этапов автоматически.
   Каждый этап имеет 5 заданий.
*/

const topics = [

"Приветствия",
"Знакомство",
"Числа",
"Цвета",
"Семья",
"Дом",
"Еда",
"Школа",
"Одежда",
"Животные",

"Мой день",
"Время",
"Погода",
"Город",
"Транспорт",
"Глаголы",
"Прилагательные",
"Покупки",
"Ресторан",
"Путешествия",

"Present Simple",
"Present Continuous",
"Past Simple",
"Future",
"Вопросы",
"Местоимения",
"Can / Can't",
"Have / Has",
"There is / There are",
"Повторение 1",

"Comparatives",
"Superlatives",
"Past Continuous",
"Present Perfect",
"Conditionals",
"Modal verbs",
"Связки",
"Предлоги",
"Фразовые глаголы",
"Повторение 2",

"Разговор 1",
"Разговор 2",
"Путешествие",
"Ресторан",
"Магазин",
"Город",
"Здоровье",
"Работа",
"Хобби",
"Повторение 3",

"Продвинутые фразы",
"Уверенная речь",
"Свободное время",
"Новости",
"Интернет",
"Большой тест",
"Разговорный тест",
"Финальная грамматика",
"Финальная речь",
"🏆 Финал Lingo Pro"

];


/* Базовые задания */

const questionSets = [

{
type:"choice",
question:"Hello",
correct:"Привет",
answers:[
"Привет",
"Спасибо",
"Дом",
"Школа"
]
},

{
type:"type",
question:"Напиши: спасибо",
correct:"thank you"
},

{
type:"choice",
question:"Good morning",
correct:"Доброе утро",
answers:[
"Доброе утро",
"Спокойной ночи",
"До свидания",
"Извините"
]
},

{
type:"audio",
question:"Послушай слово и выбери его",
correct:"hello",
answers:[
"hello",
"book",
"water",
"house"
]
},

{
type:"type",
question:"Напиши: друг",
correct:"friend"
}

];


/*
   Создаём 60 этапов.
*/

for(let i=0;i<60;i++){

    lessons.push({

        title:topics[i],

        questions:questionSets.map(q=>({

            type:q.type,

            question:q.question,

            correct:q.correct,

            answers:q.answers
                ? [...q.answers]
                : undefined

        }))

    });

}


/* =====================================================
   ПОЛЬЗОВАТЕЛИ
===================================================== */

let users;

try{

    users=JSON.parse(
        localStorage.getItem("LingoProUsers")
    ) || {};

}catch(e){

    users={};

}


let currentUser=
    localStorage.getItem(
        "LingoProCurrent"
    );


let state=null;

let lessonNumber=0;

let questionNumber=0;

let hearts=5;


/* =====================================================
   НОВЫЙ ПРОФИЛЬ
===================================================== */

function newState(){

    return {

        xp:0,

        gems:50,

        streak:0,

        completed:[],

        lastDay:""

    };

}


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

function save(){

    users[currentUser]=state;

    localStorage.setItem(
        "LingoProUsers",
        JSON.stringify(users)
    );

}


/* =====================================================
   СОЗДАНИЕ
===================================================== */

function createUser(){

    const input=
        document.getElementById(
            "nameInput"
        );

    const name=
        input.value.trim();

    if(name===""){

        alert(
            "Сначала напиши имя."
        );

        return;
    }


    currentUser=
        name.toLowerCase();


    if(!users[currentUser]){

        users[currentUser]=
            newState();

    }


    state=
        users[currentUser];


    localStorage.setItem(
        "LingoProCurrent",
        currentUser
    );


    save();


    document
        .getElementById(
            "profileModal"
        )
        .classList.add("hidden");


    renderHome();

}


/* =====================================================
   ГЛАВНАЯ
===================================================== */

function renderHome(){

    document.getElementById(
        "hello"
    ).textContent=
        "Привет, "+
        capitalize(currentUser)+
        "! 🦉";


    document.getElementById(
        "xp"
    ).textContent=
        state.xp;


    document.getElementById(
        "gems"
    ).textContent=
        state.gems;


    document.getElementById(
        "streak"
    ).textContent=
        state.streak;


    const progress=
        state.completed.length/
        60*
        100;


    document.getElementById(
        "mainProgress"
    ).style.width=
        progress+"%";


    const units=
        document.getElementById(
            "units"
        );

    units.innerHTML="";


    for(
        let unit=0;
        unit<12;
        unit++
    ){

        const box=
            document.createElement(
                "div"
            );

        box.className="unit";


        const start=
            unit*5;

        const end=
            start+5;


        box.innerHTML=
            "<h3>📚 Этапы "+
            (start+1)+
            "–"+
            end+
            "</h3>";


        const grid=
            document.createElement(
                "div"
            );

        grid.className="lessons";


        for(
            let i=start;
            i<end;
            i++
        ){

            const button=
                document.createElement(
                    "button"
                );


            const unlocked=
                i===0 ||
                state.completed.includes(
                    i-1
                );


            const completed=
                state.completed.includes(
                    i
                );


            button.className=
                "lesson "+
                (
                    completed
                    ?"done"
                    :
                    !unlocked
                    ?"locked"
                    :""
                );


            button.disabled=
                !unlocked;


            button.textContent=
                completed
                ?"✅ "+(i+1)
                :
                unlocked
                ?"▶ "+(i+1)
                :"🔒 "+(i+1);


            if(unlocked){

                button.onclick=
                    function(){

                        startLesson(i);

                    };

            }


            grid.appendChild(
                button
            );

        }


        box.appendChild(
            grid
        );


        units.appendChild(
            box
        );

    }

}


/* =====================================================
   НАЧАЛО УРОКА
===================================================== */

function startLesson(number){

    lessonNumber=
        number;

    questionNumber=
        0;

    hearts=
        5;


    document.getElementById(
        "home"
    ).style.display=
        "none";


    document.getElementById(
        "lessonScreen"
    ).style.display=
        "block";


    document.getElementById(
        "lessonTitle"
    ).textContent=
        "Этап "+
        (number+1)+
        ": "+
        lessons[number].title;


    document.getElementById(
        "hearts"
    ).textContent=
        hearts;


    showQuestion();

}


/* =====================================================
   ПОКАЗ ЗАДАНИЯ
===================================================== */

function showQuestion(){

    const lesson=
        lessons[
            lessonNumber
        ];


    const item=
        lesson.questions[
            questionNumber
        ];


    const percent=
        questionNumber/
        lesson.questions.length*
        100;


    document.getElementById(
        "lessonProgress"
    ).style.width=
        percent+"%";


    document.getElementById(
        "feedback"
    ).textContent="";


    const q=
        document.getElementById(
            "question"
        );


    const answers=
        document.getElementById(
            "answers"
        );


    q.innerHTML="";

    answers.innerHTML="";


    /* ВЫБОР */

    if(item.type==="choice"){

        q.innerHTML=
            '<div class="question">'+
            item.question+
            '</div>';


        item.answers.forEach(
            function(answer){

                addAnswer(
                    answer,
                    answer===item.correct
                );

            }
        );

    }


    /* ПИСЬМО */

    if(item.type==="type"){

        q.innerHTML=
            '<div class="question">'+
            item.question+
            '</div>'+
            '<input id="answerInput" class="input" placeholder="Напиши ответ...">'+
            '<br><br>'+
            '<button class="button green" onclick="checkTyped()">Проверить</button>';

        setTimeout(
            function(){

                document
                    .getElementById(
                        "answerInput"
                    )
                    .focus();

            },
            100
        );

    }


    /* АУДИО */

    if(item.type==="audio"){

        q.innerHTML=
            '<div class="question">'+
            item.question+
            '</div>'+
            '<button class="audio" onclick="speak()">🔊</button>';


        item.answers.forEach(
            function(answer){

                addAnswer(
                    answer,
                    answer===item.correct
                );

            }
        );

    }

}


/* =====================================================
   КНОПКИ ОТВЕТОВ
===================================================== */

function addAnswer(
    text,
    correct
){

    const button=
        document.createElement(
            "button"
        );


    button.className=
        "answer";


    button.textContent=
        text;


    button.onclick=
        function(){

            checkAnswer(
                correct
            );

        };


    document.getElementById(
        "answers"
    ).appendChild(
        button
    );

}


/* =====================================================
   АУДИО
===================================================== */

function speak(){

    const item=
        lessons[
            lessonNumber
        ].questions[
            questionNumber
        ];


    if(!window.speechSynthesis){

        alert(
            "Твой браузер не поддерживает озвучивание."
        );

        return;
    }


    const speech=
        new SpeechSynthesisUtterance(
            item.correct
        );


    speech.lang=
        "en-US";


    speech.rate=
        .8;


    speechSynthesis.cancel();

    speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   ПРОВЕРКА ПИСЬМА
===================================================== */

function checkTyped(){

    const input=
        document.getElementById(
            "answerInput"
        );


    const user=
        input.value
        .trim()
        .toLowerCase();


    const correct=
        lessons[
            lessonNumber
        ].questions[
            questionNumber
        ].correct
        .trim()
        .toLowerCase();


    checkAnswer(
        user===correct
    );

}


/* =====================================================
   ОТВЕТ
===================================================== */

function checkAnswer(correct){

    const feedback=
        document.getElementById(
            "feedback"
        );


    if(correct){

        feedback.textContent=
            "✅ Правильно! +10 XP";


        state.xp+=10;

        state.gems+=2;


        if(state.xp>=100){

            state.xp-=100;

            feedback.textContent=
                "🎉 Новый уровень!";

        }


        save();


        setTimeout(
            nextQuestion,
            700
        );


    }else{

        hearts--;


        document.getElementById(
            "hearts"
        ).textContent=
            hearts;


        feedback.textContent=
            "❌ Неправильно. Попробуй ещё раз.";


        if(hearts<=0){

            feedback.textContent=
                "❤️ Жизни закончились. Этап начнётся заново.";


            setTimeout(
                function(){

                    hearts=5;

                    questionNumber=0;

                    document.getElementById(
                        "hearts"
                    ).textContent=
                        hearts;

                    showQuestion();

                },
                1200
            );

        }

    }

}


/* =====================================================
   СЛЕДУЮЩИЙ ВОПРОС
===================================================== */

function nextQuestion(){

    questionNumber++;


    if(
        questionNumber>=
        lessons[
            lessonNumber
        ].questions.length
    ){

        finishLesson();

        return;
    }


    showQuestion();

}


/* =====================================================
   ЗАВЕРШЕНИЕ
===================================================== */

function finishLesson(){

    if(
        !state.completed.includes(
            lessonNumber
        )
    ){

        state.completed.push(
            lessonNumber
        );


        state.xp+=20;

        state.gems+=10;


        const today=
            new Date()
            .toISOString()
            .slice(0,10);


        if(
            state.lastDay!==today
        ){

            state.streak++;

            state.lastDay=
                today;

        }


        save();

    }


    document.getElementById(
        "lessonProgress"
    ).style.width=
        "100%";


    document.getElementById(
        "question"
    ).innerHTML=
        '<div class="question">'+
        '🎉 Этап завершён!'+
        '</div>';


    document.getElementById(
        "answers"
    ).innerHTML=
        '<div style="text-align:center">'+
        '<p style="margin-bottom:20px">'+
        'Ты получил ⭐ +20 XP и 💎 +10'+
        '</p>'+
        '<button class="button green" onclick="goHome()">'+
        'Продолжить'+
        '</button>'+
        '</div>';


    document.getElementById(
        "feedback"
    ).textContent=
        "Следующий этап открыт 🔓";

}


/* =====================================================
   НАЗАД
===================================================== */

function goHome(){

    document.getElementById(
        "lessonScreen"
    ).style.display=
        "none";


    document.getElementById(
        "home"
    ).style.display=
        "block";


    renderHome();

}


/* =====================================================
   ВСПОМОГАТЕЛЬНАЯ
===================================================== */

function capitalize(text){

    if(!text){
        return "";
    }

    return text
        .charAt(0)
        .toUpperCase()+
        text.slice(1);

}


/* =====================================================
   ЗАПУСК
===================================================== */

if(currentUser){

    state=
        users[currentUser] ||
        newState();


    document.getElementById(
        "profileModal"
    ).classList.add("hidden");


    renderHome();

}else{

    document.getElementById(
        "profileModal"
    ).classList.remove("hidden");

}

</script>

</body>
</html>n
